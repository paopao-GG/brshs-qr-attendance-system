# TRACKIFY V1 configuration. Secrets live in .env, never here.

[school]
name = "Bicol Regional Science High School"
entry_open = "06:00"
late_threshold = "07:15"
dismissal_time = "16:00"
early_departure_cutoff = "15:30"

[scanning]
debounce_minutes = 5
max_scans_per_day = 6
input_rate_limit_per_sec = 5

[camera]
# Webcam QR scanning. Set enabled = false to run keyboard-only (a USB HID scanner
# needs nothing here -- it is a keyboard).
enabled = true
device = "Web Camera"            # substring of the camera name; "" = first available
width = 1280
height = 720
decode_fps = 10        # decode attempts/sec; the preview itself stays at 30 fps
# A code must be ABSENT for this many decode attempts before it may fire again.
# Absence, not time, is what re-arms it: a card left in front of the lens must
# never register twice.
absence_frames = 5
cooldown_ms = 1500     # floor; the kiosk raises it to the current result hold time

[screening]
# Every student who scans in is screened with the separate handheld detector; the
# outcome is recorded, INCLUDING the clears -- they are the denominator of the
# confirmation rate. See docs/prohibited-items.md.
enabled = true
declared_items_hint = "phone, laptop, tablet, tumbler, coins"
# There is no timeout. The result screen holds until the operator clicks an outcome,
# and a scan arriving before that is refused rather than recorded. See
# docs/prohibited-items.md section 5.

[notifications]
# in_and_out = text guardian on arrival and departure
# exceptions_only = text only for late / absent
policy = "in_and_out"
coalesce_window_minutes = 3
retry_limit = 5
backoff_seconds = [30, 120, 600, 1800, 3600]

# Weekly attendance summary to every consenting guardian, sent when a person presses
# "Send weekly summaries" in the records screen -- never automatically. ~1 text per
# guardian per week.
weekly_summary = true

# Warn a guardian when a student reaches the month's absence threshold. Rides the
# end-of-day close, so it arrives the day it happens. Fires at absence_warn_at and
# again at monthly_absence_limit, then goes quiet -- a text on every further absence
# is nagging, and by then the conversation belongs to a person.
absence_reminders = true
monthly_absence_limit = 3
absence_warn_at = 2

[limits]
# Circuit breaker. Set slightly above realistic peak (students x 2 + absences).
# Its job is to catch a loop bug, not to ration normal use -- and on an unli-text SIM
# there is no cost brake, so this is the only thing that stops one.
daily_message_cap = 1000
per_recipient_daily_cap = 6
requests_per_second = 2

[gsm]
# SIM800C over USB serial. Leave port empty to auto-detect the CH340 bridge by its
# USB VID:PID -- the same code then finds COM3 on Windows and /dev/ttyUSB0 on the Pi.
port = ""
baud = 115200
# A 2G submit really can take this long. A shorter timeout manufactures ambiguity,
# and ambiguous sends are parked for a human rather than retried.
send_timeout_s = 60
init_timeout_s = 10

[risk]
mu_tardiness = 0.20
nu_early_departure = 0.25

[risk.bands]
low = 0.30
monitor = 0.55
elevated = 0.75
# Who set these and when. A boundary decides whether a real student is referred, so it
# is an institutional decision -- leave these blank and every export says the cutoffs
# are placeholders, which is what an unattributed cutoff is.
set_by = "Guidance counsellor and discipline officer, Bicol Regional Science High School"
set_on = "2026-08-27"

# A confirmed prohibited-item incident sets a MINIMUM band, by severity. It is a floor
# and not a weighted criterion: over a short study there are too few incidents to fit
# or defend a weight for one, and a fitted or elicited coefficient for a rare,
# categorical event is not defensible either way. See docs/prohibited-items.md
# section 9.
#
# A floor may RAISE a band, never lower one. These are the school's decision, like the
# cutoffs above.
[risk.incident_floor]
severity_1 = "Monitor"      # tool with a legitimate school use (scissors, compass)
severity_2 = "Monitor"      # other prohibited object
severity_3 = "Elevated"     # pointed, not bladed
severity_4 = "High"         # bladed, or blunt impact

# DepEd School Form 2 (SF2), Daily Attendance Report of Learners. Everything else on
# that form is derived from the database -- these four are institutional facts it has
# no column for. Left blank, they print as blank lines for somebody to write on, which
# is what an unfinished form should look like. See docs/personel-access.md.
[sf2]
school_id = "301814"
school_year = "2026 - 2027"
# Blank falls back to the section's adviser in the users table. Set it here when that
# is still a role placeholder rather than a person.
adviser_name = ""
school_head_name = ""
